<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brandbook OS generator</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="favicon-lagutierrez.png" />
    <link rel="apple-touch-icon" href="favicon-lagutierrez.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- ===================== CSS STYLES ===================== -->
    <style>
      /* ============================================================
   BRANDBOOK OS 101 — widget embebible · identidad LaGutierrez
   Todo el CSS está bajo .bmk para no chocar con tu web.
   Paleta: Rojo Pasión #8C2936 · Blanco Fantasmal #FFFFFF ·
           Sombra Oscura #000000 · Beige Costero #F9EED9
   ============================================================ */

      /* Base reset and theme variables for the dashboard shell */
      .bmk {
        --rojo: #8c2936;
        --blanco: #ffffff;
        --sombra: #000000;
        --beige: #f9eed9;
        --bg: var(--beige);
        --surface: var(--blanco);
        --ink: #231f20;
        --muted: #76625e;
        --line: #ead5c6;
        --line-strong: #d8b3aa;
        --accent: var(--rojo);
        --accent-soft: #f3dcd8;
        --radius: 4px;
        --serif: "Libre Caslon Text", Georgia, "Times New Roman", serif;
        --tabs-dur: 250ms;
        --tabs-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --stagger-dur: 500ms;
        --stagger-distance: 12px;
        --stagger-stagger: 40ms;
        --stagger-blur: 3px;
        --stagger-ease: cubic-bezier(0.22, 1, 0.36, 1);
        background: var(--bg);
        color: var(--ink);
        font-family: var(--serif);
        font-size: 15px;
        line-height: 1.6;
        padding: 56px 20px 72px;
        -webkit-font-smoothing: antialiased;
      }
      .bmk *,
      .bmk *::before,
      .bmk *::after {
        box-sizing: border-box;
      }
      .bmk button,
      .bmk input,
      .bmk textarea {
        font-family: var(--serif);
      }
      .bmk button {
        font-size: inherit;
        color: inherit;
        cursor: pointer;
      }
      .bmk h1,
      .bmk h2,
      .bmk h3,
      .bmk h4,
      .bmk p {
        margin: 0;
      }
      .bmk em {
        font-style: italic;
      }
      .bmk-wrap {
        max-width: 1080px;
        margin: 0 auto;
      }
      .bmk-eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink);
      }

      /* Buttons, links, and shared CTA styling used across the dashboard */
      /* ---------- Buttons ---------- */
      .bmk-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--rojo);
        background: var(--rojo);
        color: var(--blanco) !important;
        padding: 12px 22px;
        border-radius: 999px;
        font-size: 14px;
        letter-spacing: 0.02em;
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .bmk-btn:hover {
        background: var(--sombra);
        border-color: var(--sombra);
      }
      .bmk-btn--ghost {
        background: transparent;
        color: var(--ink) !important;
        border-color: var(--line-strong);
      }
      .bmk-btn--ghost:hover {
        background: var(--surface);
        border-color: var(--rojo);
        color: var(--rojo) !important;
      }
      .bmk-link {
        background: none;
        border: 0;
        padding: 6px 0;
        font-size: 14px;
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .bmk-link:hover {
        color: var(--rojo);
      }

      /* Progress indicator used to show completion across the roadmap */
      /* ---------- Progress bar ---------- */
      .bmk-bar {
        height: 3px;
        background: var(--line);
        overflow: hidden;
      }
      .bmk-bar > i {
        display: block;
        height: 100%;
        background: var(--sombra);
        transition: width 0.35s ease;
      }
      .bmk-bar.is-done > i {
        background: var(--rojo);
      }

      /* Hero header and top summary card for the roadmap landing view */
      /* ---------- MAP: hero ---------- */
      .bmk-hero {
        display: grid;
        grid-template-columns: 1fr 250px;
        gap: 40px;
        align-items: end;
        padding-bottom: 8px;
      }
      .bmk-hero h1 {
        font-weight: 400;
        font-size: clamp(44px, 6.6vw, 76px);
        line-height: 1;
        letter-spacing: -0.015em;
        margin: 0;
        color: var(--sombra);
        width: fit-content;
        max-width: 100%;
      }
      .bmk-hero h1 em {
        color: var(--rojo);
      }
      .bmk-panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 14px 16px;
      }
      .bmk-panel-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 10px;
      }
      .bmk-pct {
        font-size: 24px;
        line-height: 1;
        color: var(--rojo);
      }
      .bmk-panel .bmk-btn {
        width: 100%;
        justify-content: center;
        margin-top: 14px;
        padding: 9px 14px;
        font-size: 13px;
      }

      /* Step roadmap rail and status nodes for the main navigation flow */
      /* ---------- MAP: rail ---------- */
      .bmk-rail {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        margin: 80px 0 0;
      }
      .bmk-rail-step {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        background: none;
        border: 0;
        padding: 0;
      }
      .bmk-rail-step:not(:last-child)::after {
        content: "";
        position: absolute;
        top: 17px;
        left: calc(50% + 22px);
        right: calc(-50% + 22px);
        height: 1px;
        background: var(--line-strong);
      }
      .bmk-rail-step.is-done:not(:last-child)::after {
        background: var(--rojo);
      }
      .bmk-node {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid var(--line-strong);
        background: var(--surface);
        display: grid;
        place-items: center;
        font-size: 12px;
        color: var(--muted);
        transition: all 0.2s;
      }
      .bmk-rail-step.is-done .bmk-node {
        background: var(--rojo);
        border-color: var(--rojo);
        color: var(--blanco);
      }
      .bmk-rail-step.is-partial .bmk-node {
        border-color: var(--sombra);
        color: var(--sombra);
      }
      .bmk-rail-step.is-next .bmk-node {
        border-color: var(--rojo);
        color: var(--rojo);
        box-shadow: 0 0 0 5px var(--accent-soft);
      }
      .bmk-rail-step.is-final .bmk-node {
        background: var(--sombra);
        border-color: var(--sombra);
        color: var(--beige);
      }
      .bmk-rail-label {
        font-size: 13px;
        color: var(--muted);
        text-align: center;
        line-height: 1.3;
        padding: 0 4px;
      }
      .bmk-rail-step:hover .bmk-rail-label {
        color: var(--rojo);
      }

      /* ---------- MAP: filas bajo la línea de tiempo / rows under the timeline ---------- */
      /* Filas editoriales: etiqueta en cursiva a la izquierda, contenido a la derecha */
      .bmk-how {
        max-width: 820px;
        margin: 80px auto 0;
        display: grid;
        gap: 30px;
      }
      .bmk-row {
        display: grid;
        grid-template-columns: 170px 1fr;
        gap: 28px;
        align-items: baseline;
      }
      .bmk-row > em {
        font-size: 19px;
        color: var(--rojo);
        text-align: right;
      }
      .bmk-row p {
        font-size: clamp(18px, 2.2vw, 22px);
        line-height: 1.2;
        color: var(--sombra);
      }
      .bmk-row p small {
        display: block;
        font-size: 14px;
        line-height: 1.5;
        color: var(--muted);
        margin-top: 6px;
      }

      /* Section tabs and active state treatment for the stepper navigation */
      /* ---------- Stepper — Transitions.dev "Tabs sliding" ---------- */
      .bmk-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--rojo);
      }
      .bmk-steps,
      .bmk-lang {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 3px;
        border-radius: 48px;
        background: #f0ddc4;
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .bmk-steps::-webkit-scrollbar {
        display: none;
      }
      .bmk-steps-pill,
      .bmk-lang-pill {
        position: absolute;
        top: 3px;
        left: 0;
        height: 30px;
        width: 0;
        background: var(--blanco);
        border-radius: 48px;
        box-shadow:
          0 1px 2px rgba(140, 41, 54, 0.14),
          0 2px 6px -2px rgba(140, 41, 54, 0.14);
        transform: translateX(0);
        transition:
          transform var(--tabs-dur) var(--tabs-ease),
          width var(--tabs-dur) var(--tabs-ease);
        will-change: transform, width;
        z-index: 0;
        pointer-events: none;
      }
      .bmk-pill {
        position: relative;
        z-index: 1;
        flex: none;
        appearance: none;
        border: 0;
        background: transparent;
        height: 30px;
        min-width: 40px;
        padding: 4px 12px;
        border-radius: 48px;
        font-size: 13px;
        color: rgba(35, 31, 32, 0.7);
        white-space: nowrap;
        transition: color var(--tabs-dur) var(--tabs-ease);
      }
      .bmk-pill:not([aria-selected="true"]):hover,
      .bmk-pill[aria-selected="true"] {
        color: var(--sombra);
      }
      .bmk-pill.is-done {
        color: var(--rojo);
      }
      .bmk-util {
        display: flex;
        justify-content: flex-end;
        margin: -32px 0 16px;
      }
      .bmk-saved {
        font-size: 13px;
        font-style: italic;
        color: var(--muted);
        transition: color 0.3s;
      }
      .bmk-saved.flash {
        color: var(--rojo);
      }
      @media (prefers-reduced-motion: reduce) {
        .bmk-steps-pill,
        .bmk-lang-pill,
        .bmk-pill {
          transition: none !important;
        }
      }

      /* Main form layout for each content block and its field inputs */
      /* ---------- SECTION ---------- */
      .bmk-layout {
        display: grid;
        grid-template-columns: 270px 1fr;
        gap: 48px;
        margin-top: 40px;
        align-items: start;
      }
      .bmk-aside {
        position: sticky;
        top: 24px;
      }
      .bmk-aside h2 {
        font-weight: 400;
        font-size: clamp(30px, 3.4vw, 38px);
        line-height: 1.05;
        letter-spacing: -0.01em;
        margin: 16px 0 6px;
        color: var(--sombra);
      }
      .bmk-aside .bmk-desc {
        color: var(--muted);
        margin: 0 0 24px;
        font-size: 15px;
        font-style: italic;
        line-height: 1.4;
      }
      .bmk-tip {
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--rojo);
        font-size: 15px;
        font-style: italic;
        line-height: 1.45;
      }
      .bmk-tip em {
        font-style: normal;
      }
      .bmk-tip b {
        display: block;
        font-size: 10.5px;
        font-style: normal;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink);
        margin-bottom: 8px;
      }

      .bmk-form {
        border-bottom: 1px solid var(--line);
      }
      .bmk-field {
        display: grid;
        grid-template-columns: 190px 1fr;
        gap: 10px 36px;
        padding: 28px 0;
        border-top: 1px solid var(--line);
      }
      .bmk-field:first-child {
        padding-top: 6px;
        border-top: 0;
      }
      .bmk-field-head {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .bmk-check {
        width: 16px;
        height: 16px;
        margin-top: 5px;
        border-radius: 50%;
        border: 1px solid var(--line-strong);
        display: grid;
        place-items: center;
        flex: none;
        font-size: 9px;
        color: transparent;
        transition: all 0.2s;
        font-family: system-ui, sans-serif;
      }
      .bmk-field.is-done .bmk-check {
        background: var(--rojo);
        border-color: var(--rojo);
        color: var(--blanco);
      }
      .bmk-label {
        display: block;
        font-size: 19px;
        font-style: italic;
        line-height: 1.25;
        color: var(--sombra);
      }
      .bmk-field.is-done .bmk-label {
        color: var(--rojo);
      }
      .bmk .bmk-hint {
        color: var(--muted);
        font-size: 14px;
        margin: 2px 0 12px;
      }
      .bmk .bmk-hint em {
        color: var(--ink);
      }
      .bmk-input {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        padding: 11px 13px;
        font-size: 15px;
        color: var(--ink);
        background: var(--blanco);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .bmk-input:focus {
        outline: none;
        border-color: var(--rojo);
        box-shadow: 0 0 0 3px rgba(140, 41, 54, 0.1);
      }
      textarea.bmk-input {
        resize: vertical;
        min-height: 48px;
        line-height: 1.55;
      }
      .bmk-list {
        display: grid;
        gap: 8px;
      }
      .bmk-list-row {
        display: grid;
        grid-template-columns: 24px 1fr auto;
        align-items: center;
        gap: 8px;
      }
      .bmk-list-n {
        color: var(--rojo);
        font-size: 15px;
        text-align: center;
        font-style: italic;
      }
      /* Lista con etiqueta por fila (tono por situación, valor por valor) */
      .bmk-list--labelled .bmk-list-row {
        grid-template-columns: 96px 1fr auto;
        align-items: start;
      }
      .bmk-list--labelled .bmk-list-n {
        text-align: left;
        font-size: 13px;
        line-height: 1.45;
        padding-top: 9px;
        overflow-wrap: anywhere;
      }
      .bmk-x {
        border: 0;
        background: none;
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
        padding: 6px;
      }
      .bmk-x:hover {
        color: var(--rojo);
      }
      .bmk-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        padding: 7px;
        background: var(--blanco);
        min-height: 46px;
      }
      .bmk-tags:focus-within {
        border-color: var(--rojo);
        box-shadow: 0 0 0 3px rgba(140, 41, 54, 0.1);
      }
      .bmk-tag {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        background: var(--beige);
        border-radius: 999px;
        padding: 3px 4px 3px 12px;
        font-size: 14px;
        font-style: italic;
      }
      .bmk-tag .bmk-x {
        font-size: 15px;
        padding: 2px 6px;
        font-style: normal;
      }
      .bmk-tag-input {
        flex: 1;
        min-width: 140px;
        border: 0;
        outline: none;
        font-size: 15px;
        padding: 4px 6px;
        background: transparent;
        color: var(--ink);
      }
      .bmk-count {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
        font-style: italic;
      }
      .bmk-pair {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 12px;
        align-items: center;
      }
      .bmk-pair span {
        font-size: 26px;
        color: var(--rojo);
        line-height: 1;
        font-style: italic;
      }
      .bmk-input::placeholder {
        color: #b9a49e;
      }
      .bmk-fixed {
        background: var(--beige);
        border-radius: var(--radius);
        padding: 14px 16px;
        font-size: 14px;
      }
      .bmk-fixed ol {
        margin: 0;
        padding-left: 20px;
      }
      .bmk-fixed li {
        padding: 2px 0;
      }
      .bmk-fixed li::marker {
        color: var(--rojo);
      }
      .bmk-field--fixed .bmk-check {
        background: var(--line-strong);
        border-color: var(--line-strong);
        color: var(--blanco);
      }

      .bmk-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
        flex-wrap: wrap;
      }

      /* Result panel and generated Brandbook output presentation */
      /* ---------- RESULT ---------- */
      .bmk-result-head {
        margin: 40px 0 26px;
        max-width: 720px;
      }
      .bmk-result-head h2 {
        font-weight: 400;
        font-size: clamp(34px, 4.8vw, 52px);
        line-height: 1.02;
        letter-spacing: -0.015em;
        margin: 12px 0 10px;
        color: var(--sombra);
      }
      .bmk-result-head h2 em {
        color: var(--rojo);
      }
      .bmk-result-head p {
        color: var(--muted);
        font-style: italic;
        font-size: 16px;
        line-height: 1.35;
      }
      .bmk-result-head p em {
        font-style: normal;
        color: var(--ink);
      }
      .bmk-pre {
        margin: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 32px;
        font-family: var(--serif);
        font-size: 14px;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 560px;
        overflow: auto;
        color: var(--ink);
      }

      .bmk-toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translate(-50%, 20px);
        background: #000;
        color: #fff;
        padding: 10px 20px;
        border-radius: 999px;
        font-family: "Libre Caslon Text", Georgia, serif;
        font-size: 14px;
        opacity: 0;
        pointer-events: none;
        transition: all 0.25s;
        z-index: 50;
      }
      .bmk-toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* Mobile and tablet adjustments for responsive behavior */
      /* ---------- Responsive ---------- */
      /* ---------- Guía dentro de cada bloque / in-block guidance ---------- */
      .bmk-qnum {
        display: block;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 3px;
      }
      .bmk-field-head .bmk-check {
        margin-top: 24px;
      }
      .bmk-field--fixed .bmk-field-head .bmk-check {
        margin-top: 5px;
      }
      .bmk-ex-btn {
        background: none;
        border: 0;
        padding: 0;
        margin: -4px 0 12px;
        font-size: 13px;
        font-style: italic;
        color: var(--rojo);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .bmk-ex-btn:hover {
        color: var(--sombra);
      }
      .bmk-ex {
        margin: 0 0 12px;
        padding: 12px 14px;
        background: var(--accent-soft);
        border-radius: var(--radius);
        font-size: 14px;
        line-height: 1.5;
        font-style: italic;
        color: var(--ink);
      }
      .bmk-ex span {
        display: block;
        font-style: normal;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--rojo);
        margin-bottom: 4px;
      }
      .bmk-inblock {
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .bmk-inblock-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .bmk-inblock-top b {
        font-size: 10.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink);
      }
      .bmk-inblock-top span {
        font-size: 13px;
        color: var(--muted);
      }
      .bmk-inblock .bmk-bar {
        margin-bottom: 10px;
      }
      .bmk-sec-head {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .bmk-sec-node {
        width: 38px;
        height: 38px;
        flex: none;
        border-radius: 50%;
        border: 1px solid var(--rojo);
        background: var(--blanco);
        color: var(--rojo);
        display: grid;
        place-items: center;
        font-size: 13px;
        box-shadow: 0 0 0 5px var(--accent-soft);
      }
      .bmk-sec-of {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .bmk-checklist {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 1px;
      }
      .bmk-checklist button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        background: none;
        border: 0;
        padding: 5px 0;
        font-size: 14px;
        color: var(--muted);
        text-align: left;
      }
      .bmk-checklist button:hover {
        color: var(--rojo);
      }
      .bmk-checklist .bmk-check {
        margin-top: 0;
      }
      .bmk-checklist button.is-done {
        color: var(--ink);
      }
      .bmk-checklist button.is-done .bmk-check {
        background: var(--rojo);
        border-color: var(--rojo);
        color: var(--blanco);
      }
      .bmk .bmk-intro {
        margin: 0 0 30px;
        padding: 18px 22px;
        background: var(--blanco);
        border-left: 3px solid var(--rojo);
        border-radius: var(--radius);
        font-size: 16px;
        line-height: 1.55;
        color: var(--ink);
      }
      .bmk .bmk-intro em {
        color: var(--rojo);
      }

      /* Reference file upload area and attachment preview cards */
      /* ---------- Referencias con archivos ---------- */
      .bmk-drop {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        text-align: center;
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius);
        background: var(--blanco);
        padding: 22px 16px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      .bmk-drop:hover,
      .bmk-drop.is-over {
        border-color: var(--rojo);
        background: #fff8f5;
      }
      .bmk-drop.is-full {
        cursor: default;
        opacity: 0.6;
      }
      .bmk-drop-t {
        font-size: 15px;
        color: var(--ink);
      }
      .bmk-drop-t em {
        color: var(--rojo);
      }
      .bmk-drop small {
        font-size: 12px;
        font-style: italic;
        color: var(--muted);
      }
      .bmk-files {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }
      .bmk-file {
        display: grid;
        grid-template-columns: 56px 1fr auto;
        gap: 12px;
        align-items: center;
        background: var(--blanco);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 8px;
      }
      .bmk-thumb {
        width: 56px;
        height: 56px;
        border-radius: 2px;
        object-fit: cover;
        background: var(--beige);
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--rojo);
      }
      .bmk-file-meta {
        min-width: 0;
        display: grid;
        gap: 5px;
      }
      .bmk-file-name {
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bmk-file-name small {
        font-style: italic;
        color: var(--muted);
        margin-left: 8px;
      }
      .bmk-file .bmk-input {
        padding: 6px 10px;
        font-size: 14px;
      }
      .bmk-refs-or {
        margin: 16px 0 8px;
        font-size: 14px;
        color: var(--muted);
      }

      /* Brand color palette selector and tone customization controls */
      /* ---------- Selectores visuales ---------- */
      .bmk-opts {
        display: grid;
        gap: 12px;
      }
      .bmk-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(152px, 1fr));
        gap: 10px;
      }
      .bmk-card {
        display: grid;
        gap: 7px;
        padding: 10px;
        background: var(--blanco);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        text-align: left;
        cursor: pointer;
        transition:
          border-color 0.18s,
          box-shadow 0.18s;
      }
      .bmk-card:hover {
        border-color: var(--line-strong);
      }
      .bmk-card.is-on {
        border-color: var(--rojo);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .bmk-card-vis {
        width: 100%;
        height: 56px;
        display: block;
        border-radius: calc(var(--radius) - 1px);
        border: 1px solid var(--line);
      }
      .bmk-card-t {
        font-size: 13.5px;
        font-weight: 700;
        color: var(--ink);
        line-height: 1.3;
      }
      .bmk-card-h {
        font-size: 12.5px;
        font-style: italic;
        color: var(--muted);
        line-height: 1.45;
      }
      /* pares */
      .bmk-pairs {
        display: grid;
        gap: 8px;
      }
      .bmk-pairopt {
        display: grid;
        gap: 3px;
        padding: 10px 12px;
        background: var(--blanco);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        text-align: left;
        cursor: pointer;
        transition:
          border-color 0.18s,
          box-shadow 0.18s;
      }
      .bmk-pairopt:hover {
        border-color: var(--line-strong);
      }
      .bmk-pairopt.is-on {
        border-color: var(--rojo);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .bmk-poles {
        font-size: 14px;
        color: var(--ink);
      }
      .bmk-pole-x {
        color: var(--rojo);
        padding: 0 7px;
      }
      /* chips */
      .bmk-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .bmk-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 11px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--blanco);
        color: var(--ink);
        font-size: 13px;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
      }
      .bmk-chip:hover:not([disabled]) {
        border-color: var(--rojo);
      }
      .bmk-chip.is-on {
        background: var(--rojo);
        border-color: var(--rojo);
        color: var(--blanco);
      }
      .bmk-chip[disabled] {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .bmk-chip svg {
        width: 14px;
        height: 14px;
        flex: none;
      }
      /* interruptores */
      .bmk-toggles {
        display: grid;
        gap: 8px;
      }
      .bmk-pairopt svg {
        width: 100%;
        height: 32px;
        display: block;
        margin-bottom: 5px;
      }
      .bmk-toggle svg {
        width: 46px;
        height: 26px;
        flex: none;
      }
      .bmk-toggle {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 10px 12px;
        background: var(--blanco);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        text-align: left;
        cursor: pointer;
      }
      .bmk-toggle > span:first-child {
        display: grid;
        gap: 2px;
      }
      .bmk-toggle.is-on {
        border-color: var(--rojo);
      }
      .bmk-switch {
        width: 34px;
        height: 20px;
        border-radius: 999px;
        background: var(--line);
        position: relative;
        flex: none;
        transition: background 0.18s;
      }
      .bmk-switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--blanco);
        transition: transform 0.18s;
      }
      .bmk-toggle.is-on .bmk-switch {
        background: var(--rojo);
      }
      .bmk-toggle.is-on .bmk-switch::after {
        transform: translateX(14px);
      }
      /* segmentado */
      .bmk-seg {
        display: flex;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .bmk-seg button {
        flex: 1;
        display: grid;
        gap: 4px;
        justify-items: center;
        padding: 9px 6px;
        background: var(--blanco);
        border: 0;
        border-left: 1px solid var(--line);
        color: var(--ink);
        font-size: 12.5px;
        cursor: pointer;
      }
      .bmk-seg button:first-child {
        border-left: 0;
      }
      .bmk-seg button.is-on {
        background: var(--rojo);
        color: var(--blanco);
      }
      /* acciones comunes */
      .bmk-note {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 2px;
        border: 0;
        border-bottom: 1px solid transparent;
        border-radius: 0;
        background: none;
        font-family: inherit;
        font-size: 13.5px;
        font-style: italic;
        color: var(--ink);
        transition: border-color 0.18s;
      }
      .bmk-note::placeholder {
        color: var(--muted);
        opacity: 0.65;
      }
      .bmk-note:hover {
        border-bottom-color: var(--line);
      }
      .bmk-note:focus,
      .bmk-note.is-set {
        outline: none;
        border-bottom-color: var(--rojo);
      }
      .bmk-opt-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
      }
      .bmk-empty {
        display: grid;
        gap: 10px;
        padding: 14px 16px;
        background: var(--blanco);
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius);
        font-size: 13px;
        color: var(--muted);
      }
      .bmk-empty p {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      /* .bmk-why solo sobrevive dentro de los avisos de bloque vacío */
      .bmk-empty .bmk-why {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
      }
      .bmk-ex-h {
        display: block;
        margin: 10px 0 2px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--rojo);
      }
      .bmk-optbtn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 13px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--blanco);
        color: var(--ink);
        font-size: 12.5px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .bmk-optbtn:hover {
        border-color: var(--rojo);
        background: var(--beige);
      }
      .bmk-optbtn svg {
        width: 14px;
        height: 14px;
        flex: none;
        color: var(--rojo);
      }
      .bmk-optbtn--sug {
        background: var(--accent-soft);
        border-color: var(--accent-soft);
      }
      .bmk-optbtn--sug:hover {
        border-color: var(--rojo);
        background: var(--accent-soft);
      }
      /* filas con control segmentado propio */
      .bmk-rows {
        display: grid;
        gap: 12px;
      }
      .bmk-row-h {
        display: block;
        margin-bottom: 5px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--rojo);
      }
      .bmk-seg svg {
        width: 100%;
        height: 26px;
        display: block;
      }
      .bmk-auto {
        white-space: pre-wrap;
        padding: 12px 14px;
        background: var(--blanco);
        border: 1px solid var(--line);
        border-left: 3px solid var(--rojo);
        border-radius: var(--radius);
        font-size: 13.5px;
        line-height: 1.6;
        color: var(--ink);
      }
      .bmk-tech {
        margin-top: 4px;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      .bmk-tech summary {
        font-size: 12.5px;
        font-style: italic;
        color: var(--rojo);
        cursor: pointer;
        margin-bottom: 10px;
      }
      .bmk-railtip {
        display: block;
        margin-top: 3px;
        font-size: 12px;
        line-height: 1.45;
        font-style: italic;
        color: var(--muted);
      }
      /* ---------- Retrato en vivo ---------- */
      .bmk-digest {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 14px;
      }
      .bmk-dg-h {
        display: block;
        margin-bottom: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .bmk-dg-h.is-yes {
        color: var(--rojo);
      }
      .bmk-dg-h.is-no {
        color: var(--muted);
      }
      .bmk-dg-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .bmk-dg-list li {
        padding: 4px 9px;
        border-radius: 999px;
        font-size: 12px;
        line-height: 1.35;
        background: var(--blanco);
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .bmk-dg-list.is-yes li {
        border-color: var(--accent-soft);
        background: var(--accent-soft);
      }
      .bmk-dg-list.is-no li {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-color: var(--line-strong);
      }
      .bmk-dg-list li.bmk-dg-more {
        background: none;
        border-style: dashed;
        color: var(--muted);
        text-decoration: none;
      }
      .bmk-dg-empty {
        margin: 0;
        font-size: 12px;
        font-style: italic;
        color: var(--muted);
      }
      .bmk-dg-note {
        margin: 0;
        padding-left: 10px;
        border-left: 2px solid var(--rojo);
        font-size: 12px;
        font-style: italic;
        line-height: 1.45;
        color: var(--muted);
      }
      .bmk-autotag {
        font-size: 11px;
        font-style: italic;
        color: var(--rojo);
        white-space: nowrap;
      }
      .bmk-sugg {
        font-size: 12px;
        font-style: italic;
        color: var(--muted);
      }
      .bmk-optbtn:focus-visible,
      .bmk-card:focus-visible,
      .bmk-pairopt:focus-visible,
      .bmk-chip:focus-visible,
      .bmk-toggle:focus-visible,
      .bmk-seg button:focus-visible,
      .bmk-opt-link:focus-visible {
        outline: 2px solid var(--rojo);
        outline-offset: 2px;
      }
      @media (max-width: 640px) {
        .bmk-cards {
          grid-template-columns: 1fr 1fr;
        }
        .bmk-card-vis {
          height: 46px;
        }
      }
      /* ---------- Paleta de colores de marca ---------- */
      .bmk-palette {
        display: grid;
        gap: 16px;
      }
      .bmk-tones {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }
      .bmk-tone-title {
        padding: 7px 9px;
        font-size: 13px;
      }
      .bmk-tone {
        display: grid;
        gap: 8px;
        padding: 12px;
        background: var(--blanco);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .bmk-tone.is-active {
        border-color: var(--rojo);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .bmk-tone-head {
        display: flex;
        align-items: center;
        gap: 8px;
        background: none;
        border: 0;
        padding: 0;
        width: 100%;
        text-align: left;
      }
      .bmk-tone-sw {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        flex: none;
        border: 1px solid var(--line-strong);
        background: repeating-conic-gradient(#e4ddd1 0% 25%, #fff 0% 50%)
          50%/10px 10px;
      }
      .bmk-tone-label {
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink);
      }
      .bmk-tone-hex {
        padding: 7px 9px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .bmk-tone-name {
        font-size: 12.5px;
        font-style: italic;
        color: var(--muted);
        min-height: 1.3em;
      }
      .bmk-swatch-label {
        margin: 0;
        font-size: 13px;
        font-style: italic;
        color: var(--muted);
      }
      .bmk-colorpicker {
        display: flex;
        gap: 8px;
        align-items: stretch;
      }
      .bmk-hue-canvas {
        flex: 1;
        min-width: 0;
        height: 170px;
        border-radius: var(--radius);
        border: 1px solid var(--line-strong);
        cursor: crosshair;
        touch-action: none;
        display: block;
      }
      .bmk-lightbar {
        width: 30px;
        flex: none;
        height: 170px;
        border-radius: var(--radius);
        border: 1px solid var(--line-strong);
        cursor: ns-resize;
        touch-action: none;
        background: linear-gradient(to bottom, #fff, #000);
      }
      .bmk-rail-track {
        grid-column: 1 / -1;
        margin: 26px 0 2px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--rojo);
      }
      .bmk-doc-all {
        display: flex;
        justify-content: flex-end;
        margin: -8px 0 8px;
      }
      .bmk-palette-note {
        font-size: 12px;
        font-style: italic;
        margin: 0;
      }
      @media (max-width: 640px) {
        .bmk-tones {
          grid-template-columns: 1fr;
        }
        .bmk-hue-canvas,
        .bmk-lightbar {
          height: 150px;
        }
      }
      @media (max-height: 760px) {
        .bmk-aside {
          position: static;
        }
      }

      /* ---------- Pasos bloqueados / locked steps ---------- */
      .bmk-pill.is-locked,
      .bmk-pill.is-locked:hover {
        color: rgba(35, 31, 32, 0.3);
        cursor: not-allowed;
      }
      .bmk-rail-step.is-locked {
        cursor: not-allowed;
      }
      .bmk-rail-step.is-locked .bmk-node,
      .bmk-rail-step.is-final.is-locked .bmk-node {
        background: transparent;
        border-style: dashed;
        border-color: var(--line-strong);
        color: var(--line-strong);
      }
      .bmk-rail-step.is-locked .bmk-rail-label,
      .bmk-rail-step.is-locked:hover .bmk-rail-label {
        color: var(--muted);
        opacity: 0.55;
      }
      .bmk-btn.is-locked {
        background: transparent;
        border: 1px dashed var(--line-strong);
        color: var(--muted) !important;
        cursor: not-allowed;
      }
      .bmk-btn.is-locked:hover {
        background: transparent;
        border-color: var(--rojo);
        color: var(--rojo) !important;
      }

      /* Exported document card and usage guidance for the final output */
      /* ---------- Resultado: documento + guía (result: document + guide) ---------- */
      .bmk-btn svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .bmk-btn-t {
        display: inline-block;
      }
      .bmk-btn--dark {
        background: var(--sombra);
        border-color: var(--sombra);
      }
      .bmk-btn--dark:hover {
        background: var(--rojo);
        border-color: var(--rojo);
      }
      .bmk-btn.is-ok {
        background: var(--rojo);
        border-color: var(--rojo);
        color: var(--blanco) !important;
      }
      .bmk-doc {
        position: relative;
        background: var(--blanco);
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 22px 44px -34px rgba(140, 41, 54, 0.55);
      }
      .bmk-doc::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 40px;
        background: linear-gradient(rgba(255, 252, 247, 0), #fffcf7);
        pointer-events: none;
      }
      .bmk-doc-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px 20px;
        flex-wrap: wrap;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }
      .bmk-doc-file {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .bmk-doc-icon {
        width: 38px;
        height: 46px;
        flex: none;
        display: grid;
        place-items: end center;
        padding-bottom: 6px;
        border: 1px solid var(--line-strong);
        border-radius: 3px;
        background: linear-gradient(
          225deg,
          var(--accent-soft) 0 10px,
          var(--blanco) 10px
        );
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--rojo);
      }
      .bmk-doc-file b {
        display: block;
        font-size: 15px;
        font-weight: 400;
        color: var(--sombra);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bmk-doc-file small {
        display: block;
        font-size: 12px;
        font-style: italic;
        color: var(--muted);
      }
      .bmk-doc-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .bmk-doc-actions .bmk-btn {
        padding: 12px 20px;
        white-space: nowrap;
      }
      .bmk .bmk-doc .bmk-pre {
        margin: 0;
        border: 0;
        border-radius: 0;
        max-height: 280px;
        padding: 18px 22px 36px;
        background: #fffcf7;
        font-size: 12px;
        line-height: 1.6;
        color: var(--ink);
      }
      .bmk-doc .bmk-pre:focus {
        outline: none;
        box-shadow: inset 0 0 0 2px var(--accent-soft);
      }
      .bmk-guide-wrap {
        margin-top: 64px;
      }
      .bmk-guide-wrap h3 {
        margin: 0 0 22px;
        font-weight: 400;
        font-size: clamp(26px, 3vw, 34px);

        padding: 9px 14px;
        font-size: 13px;

      }
      .bmk-prompt {
        display: grid;
        gap: 6px;
      }
      .bmk-prompt button {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        width: 100%;
        text-align: left;
        background: var(--beige);
        border: 1px solid transparent;
        border-radius: 4px;

      /* ---------- Móvil: la pregunta primero ----------
         En una columna el panel lateral se interponía entre la cabecera y el
         formulario. Ahora solo el contador queda arriba, pegajoso, y la lista
         de preguntas baja detrás del formulario. */
      @media (max-width: 860px) {

          display: flex;

          order: 4;

      @media (max-width: 860px) {
        .bmk-guide {
          grid-template-columns: 1fr;
        }
        .bmk-doc-actions {
          width: 100%;

        .bmk-doc-actions .bmk-btn {
          flex: 1 1 150px;
          justify-content: center;
          padding: 12px 14px;
        }
      }

      /* Entrance and reveal animation for staged content transitions */
      /* ---------- Transitions.dev — Texts reveal ---------- */
      /* Cambio de vista: cada .bmk-line entra escalonada (--i) al añadir .is-shown al stage;
   al salir, .is-hiding hace un fundido corto de 200ms sin repetir el escalonado. */
      .bmk-line {
        opacity: 0;
        transform: translateY(var(--stagger-distance));
        filter: blur(var(--stagger-blur));
        transition:
          opacity var(--stagger-dur) var(--stagger-ease),
          transform var(--stagger-dur) var(--stagger-ease),
          filter var(--stagger-dur) var(--stagger-ease);
        transition-delay: calc(var(--stagger-stagger) * var(--i, 0));
      }
      .bmk-stage.is-shown .bmk-line {
        opacity: 1;
        transform: none;
        filter: none;
      }
      .bmk-stage.is-hiding .bmk-line,
      .bmk-stage.is-hiding.hide-all .bmk-top {
        opacity: 0;
        transform: none;
        filter: none;
        transition:
          opacity 200ms ease,
          transform 0s linear,
          filter 0s linear;
        transition-delay: 0s;
      }
      /* Actualizaciones al rellenar (check, etiqueta, contador, etiquetas nuevas…) */
      @keyframes bmk-reveal {
        from {
          opacity: 0;
          transform: translateY(var(--stagger-distance));
          filter: blur(var(--stagger-blur));
        }
        to {
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
      .bmk-upd {
        animation: bmk-reveal var(--stagger-dur) var(--stagger-ease) both;
        animation-delay: calc(var(--stagger-stagger) * var(--j, 0));
      }
      @media (prefers-reduced-motion: reduce) {
        .bmk-line {
          transition: none !important;
        }
        .bmk-upd {
          animation: none !important;
        }
      }

      @media (max-width: 860px) {
        .bmk-hero,
        .bmk-result-head {
          grid-template-columns: 1fr;
          gap: 24px;
        }
        .bmk-layout {
          grid-template-columns: 1fr;
          gap: 24px;
        }

        }
        .bmk-field {

        mask-image: linear-gradient(

          #000 14px,

        );
      }
      @media (max-width: 640px) {
        /* 16px evita el zoom automático de iOS al escribir */

        .bmk-pill,
        .bmk-steps-pill,

          height: 36px;

        .bmk-pill {
          min-width: 38px;
          padding: 4px 11px;
        }
        /* Barra superior: volver + guardado en una fila, pasos debajo a todo el ancho */
        .bmk-top {
          display: grid;
          grid-template-columns: auto 1fr;
          align-items: center;
          gap: 12px;
        }
        .bmk-top > .bmk-btn {

          justify-self: end;

        .bmk-node {

        .bmk-guide > li {

        .bmk-guide-actions .bmk-btn {
          flex: 1 1 140px;
          justify-content: center;
          min-height: 44px;
        }
        .bmk-doc-actions .bmk-btn {
          min-height: 46px;
        }
      }
      /* Red cover presentation variant and signature/logo treatment */
      /* ---------- Portada en rojo + firma con el logo (red cover + logo signature) ---------- */
      .bmk {
        transition:

      /* Título: "Brandbook OS" y debajo generator + by + logo, alineados al final */
      .bmk-title {
        width: fit-content;

      }
      .bmk-sig {

      .bmk-byline {

        font-size: clamp(26px, 3.6vw, 42px);

      }

        font-size: clamp(16px, 1.6vw, 20px);

      .bmk.is-map {
        background: var(--rojo);

      .bmk.is-map .bmk-hero h1,
      .bmk.is-map .bmk-hero h1 em {
        color: var(--blanco);
      }
      .bmk.is-map .bmk-sig em {
        color: var(--blanco);
      }
      /* El wordmark es negro sobre transparente: lo mostramos en blanco */
      .bmk.is-map .bmk-logo {
        filter: brightness(0) invert(1);
      }
      .bmk.is-map .bmk-panel {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.3);
      }
      .bmk.is-map .bmk-eyebrow {
        color: var(--blanco);

      .bmk.is-map .bmk-pct {
        color: var(--blanco);

      .bmk.is-map .bmk-bar {

      .bmk.is-map .bmk-bar > i,

      .bmk.is-map .bmk-btn:hover {

      @media (max-width: 640px) {

        }
        .bmk-by em {
          font-size: 17px;
        }
        .bmk-logo {
          width: clamp(140px, 44vw, 200px);
        }
      }
      /* Full-bleed page background treatment to keep the dashboard visually clean */
      /* ---------- Sin franja blanca: el fondo acompaña a la vista / full-bleed background ---------- */
      html,
      body {
        margin: 0;
        padding: 0;

      @supports (min-height: 100dvh) {
        .bmk {

        }
      }
      /* La firma se alinea con el final del título */
    </style>

    <script>
      (function () {

        const plain = (s) => String(s ?? "").replace(/\*/g, "");

          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></svg>';
